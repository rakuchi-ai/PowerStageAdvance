<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>応用英文法問題</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ud:"UD デジタル教科書体 NK-R","UD デジタル教科書体 N-R","UD デジタル教科書体 NP-R","UD Digital Kyokasho NK-R","UD Digital Kyokasho N-R","UD Digital Kyokasho NP-R","UDDigiKyokashoNK-R","UDDigiKyokashoN-R","UDDigiKyokashoNP-R","BIZ UDPGothic","BIZ UDGothic","BIZ UDPMincho","Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;--bg:#f3f5f4;--card:#fff;--tx:#1c2523;--mut:#66726f;--bd:#d8dedc;--board:#1f3a34;--chalk:#f2f4ef;--hi:#e8c547;--ok:#23804f;--ng:#c0392b;--sel:#1f3a34;--selx:#f2f4ef}
@media(prefers-color-scheme:dark){:root{--bg:#121816;--card:#1a2220;--tx:#e6ebe9;--mut:#93a09c;--bd:#2c3835;--board:#0f1f1b;--chalk:#eef1ec;--ok:#46c07f;--ng:#ff7b6e;--sel:#e8c547;--selx:#14201d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.7 var(--ud)}
header{background:var(--board);color:var(--chalk);padding:18px 16px 14px;border-bottom:5px solid var(--hi)}
header h1{margin:0;font-size:26px;letter-spacing:.12em;font-weight:700}
header p{margin:2px 0 0;font-size:13px;opacity:.8}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
.portal-btn{display:inline-flex;align-items:center;padding:8px 14px;background:rgba(255,255,255,.12);color:var(--chalk);border:1.5px solid rgba(255,255,255,.35);border-radius:8px;text-decoration:none;font-size:14px;font-weight:700;white-space:nowrap;transition:background .15s}
.portal-btn:hover{background:rgba(255,255,255,.22)}
main{max-width:720px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:14px}
h2{font-size:15px;margin:0 0 10px;color:var(--mut);font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:8px}
button,select,input[type=text]{font:inherit;color:inherit}
.opt{flex:1 1 0;min-width:96px;padding:10px 8px;border:1.5px solid var(--bd);background:var(--card);border-radius:8px;cursor:pointer}
.opt.on{background:var(--sel);color:var(--selx);border-color:var(--sel);font-weight:700}
.opt small{display:block;font-size:12px;opacity:.75}
select{width:100%;padding:10px;border:1.5px solid var(--bd);border-radius:8px;background:var(--card)}
.go{width:100%;padding:14px;border:0;border-radius:10px;background:var(--board);color:var(--chalk);font-size:18px;font-weight:700;cursor:pointer;border-bottom:4px solid var(--hi)}
.go:disabled{opacity:.4;cursor:not-allowed}
.link{background:none;border:0;color:var(--mut);text-decoration:underline;cursor:pointer;padding:6px 0}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;font-size:14px;color:var(--mut)}
.bar button{padding:6px 12px;border:1.5px solid var(--bd);background:var(--card);border-radius:8px;cursor:pointer}
.prog{height:6px;background:var(--bd);border-radius:3px;margin-bottom:14px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--hi)}
.unit{font-size:12px;color:var(--mut);margin-bottom:6px}
.q{font:20px/1.9 var(--ud);white-space:pre-wrap;word-break:break-word;margin:0 0 14px}
.ch{display:block;width:100%;text-align:left;padding:12px 14px;margin-bottom:8px;border:1.5px solid var(--bd);background:var(--card);border-radius:8px;cursor:pointer;font-size:17px}
.ch b{display:inline-block;width:1.6em;color:var(--mut)}
.ch.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,transparent)}
.ch.ng{border-color:var(--ng);background:color-mix(in srgb,var(--ng) 16%,transparent)}
.ch:disabled{cursor:default;color:inherit}
input[type=text]{width:100%;padding:12px;border:1.5px solid var(--bd);border-radius:8px;background:var(--card);font-size:18px}
.fb{margin-top:14px;padding:12px 14px;border-radius:8px;border-left:6px solid var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.fb.bad{border-color:var(--ng);background:color-mix(in srgb,var(--ng) 10%,transparent)}
.fb h3{margin:0 0 4px;font-size:18px}
.fb p{margin:4px 0}
.ans{font-family:var(--ud);font-size:18px;font-weight:700}
.acts{display:flex;gap:8px;margin-top:12px}
.acts button{flex:1;padding:12px;border-radius:8px;border:1.5px solid var(--bd);background:var(--card);cursor:pointer}
.acts .next{background:var(--board);color:var(--chalk);border-color:var(--board);font-weight:700}
.acts .st.on{background:var(--hi);color:#2a2200;border-color:var(--hi);font-weight:700}
.big{font-size:44px;font-weight:700;text-align:center;margin:6px 0}
.li{padding:10px 0;border-top:1px solid var(--bd)}
.li:first-child{border-top:0}
.msg{padding:14px;border:1.5px dashed var(--ng);border-radius:8px}
.rec{padding:12px 0;border-top:1px solid var(--bd)}.rec:first-child{border-top:0}.rec h3{margin:0 0 6px;font-size:16px}
.m{display:flex;align-items:center;gap:8px;font-size:14px;margin:4px 0}.m span{width:4em;color:var(--mut)}.m .t{flex:1;height:10px;background:var(--bd);border-radius:5px;overflow:hidden}.m .t i{display:block;height:100%}.m b{width:3.4em;text-align:right}.sub{font-size:12px;color:var(--mut)}
.sort-head{margin:0 0 2px;font-size:14px;color:var(--mut)}
.sort-hint{margin:0 0 12px;font-size:14px;color:var(--mut)}
.sort-line{font:26px/2.5 var(--ud);white-space:pre-wrap;word-break:break-word;margin:0 0 18px;padding:14px 16px;background:color-mix(in srgb,var(--hi) 8%,var(--card));border:1px solid var(--bd);border-radius:12px}
.sort-blank{display:inline-flex;flex-wrap:wrap;align-items:center;gap:8px;vertical-align:middle;min-width:5.5em;min-height:58px;padding:4px 8px;margin:2px 4px;border:2px dashed var(--sel);border-radius:12px;background:color-mix(in srgb,var(--sel) 6%,transparent)}
.sort-blank.solo{display:flex;margin:0 0 12px}
.sort-hole{font-size:16px;color:var(--mut);padding:0 6px}
.sort-chip{display:inline-flex;align-items:baseline;gap:6px;font:700 26px/1.3 var(--ud);padding:6px 14px;border:2px solid var(--sel);border-radius:10px;background:var(--card);color:var(--tx);cursor:pointer}
span.sort-chip{cursor:default}
.sort-chip small{font-size:15px;color:var(--mut);font-weight:400}
.sort-chip.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,transparent)}
.sort-chip.ng{border-color:var(--ng);background:color-mix(in srgb,var(--ng) 16%,transparent)}
.sort-words{display:flex;flex-wrap:wrap;gap:12px;margin:0 0 14px}
.sort-word{font:700 26px/1.3 var(--ud);padding:14px 22px;min-height:62px;border:2px solid var(--bd);border-bottom-width:5px;border-radius:14px;background:var(--card);color:var(--tx);cursor:pointer}
.sort-word small{font-size:16px;color:var(--mut);margin-right:6px;font-weight:400}
.sort-word:not(:disabled):hover,.sort-word:not(:disabled):active{border-color:var(--sel)}
.sort-word:disabled{opacity:.28;cursor:default}
.sort-tools{display:flex;align-items:center;gap:8px;padding-top:10px;border-top:1px solid var(--bd)}
.sort-tools button{padding:10px 16px;border:1.5px solid var(--bd);border-radius:8px;background:var(--card);cursor:pointer;font-size:16px}
.sort-tools button:disabled{opacity:.4;cursor:default}
.sort-left{margin-left:auto;color:var(--mut);font-size:14px}
@media(max-width:480px){.sort-line,.sort-chip,.sort-word{font-size:22px}.sort-word{padding:12px 16px;min-height:56px}.sort-blank{min-height:52px}}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
</style>
</head>
<body>
<header><div><h1 id="ttl">応用英文法問題</h1><p id="sub"></p></div><a href="https://rakuchi-ai.github.io/ENGLISH-TOP/" class="portal-btn">ポータルに戻る</a></header>
<main id="app"></main>
<script>
/* ===== テンプレートの使い方 =====
 1. このファイルを index.html にして、問題CSVを questions.csv という名前で同じフォルダに置く(GitHub Pagesなど)。
 2. CSVの列(1行目は見出し・UTF-8):
    No        問題の通し番号。学習記録のキーなので、公開後は変えない・重複させない
    単元      単元名(CSVに書いた順に表示)
    形式      「4択」または「入力」
    問題      問題文。セル内改行OK。「【和訳】」「【指示】」の前は自動で改行される。空所は (     ) のように書く
    選択肢A〜D 4択のときのみ。入力問題は空欄
    正解      4択: A〜Dのどれか1文字 / 入力: 正解の文字列(大文字小文字・余分な空白は区別しない)
    別解      入力問題の別解。「|」で区切る(4択は空欄)
    解説      解説文
    アプリ名   1行目だけに書く。画面タイトルと学習記録の保存名になる(他のアプリと重ならない名前にする。変えると記録は引き継がれない)
    サブタイトル 1行目だけに書く(省略可)
 3. フォント: 問題・解説・選択肢などすべてUDフォントで表示する。
    端末に「UD デジタル教科書体」(NK-R / N-R / NP-R)があればそれを使い、無い端末では Google Fonts の「BIZ UDPゴシック」で表示する(ネット接続が必要)。
 4. 学習記録(正誤・ストック)はブラウザのlocalStorageに保存される。
    ストック = 間違えた問題 + 自分でストックした問題(区別なし)。ストックした問題に正答すると外れる。
*/
const CSV_FILE='questions.csv';          // 問題を差し替えるときは、このCSVを入れ替える
let ALL=[], S={scope:'unit',fmt:'4択',unit:'',n:10}, Q=null, WARN=[], FM=['4択','入力'], LSK='quiz_v1';
let st={stock:[],rec:{}};
const loadSt=()=>{
  let o={};try{o=JSON.parse(localStorage.getItem(LSK))||{}}catch(e){}
  return{stock:Array.isArray(o.stock)?o.stock:[],rec:o.rec&&typeof o.rec=='object'?o.rec:{}};
};
const save=()=>{try{localStorage.setItem(LSK,JSON.stringify(st))}catch(e){}};
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s).replace(/[’‘]/g,"'").replace(/[“”]/g,'"').replace(/\s+/g,' ').trim().toLowerCase();
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function parseCSV(t){
  t=t.replace(/^\uFEFF/,'');const rows=[];let r=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
    else if(c=='"')q=true;
    else if(c==','){r.push(f);f=''}
    else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);f='';if(r.length>1||r[0]!=='')rows.push(r);r=[]}
    else f+=c}
  if(f!==''||r.length){r.push(f);rows.push(r)}
  const h=rows.shift().map(x=>x.trim());
  return rows.map(x=>{const o={};h.forEach((k,i)=>o[k]=x[i]??'');return o});
}
const circled='①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳';
function sortParts(question){
  const lines=String(question).split(/\r?\n/);
  let best=null;
  for(const line of lines){
    const matches=[...line.matchAll(/([①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳])\s*/g)];
    if(matches.length<2)continue;
    const parts=[];
    for(let i=0;i<matches.length;i++){
      const start=matches[i].index+matches[i][0].length;
      const end=i+1<matches.length?matches[i+1].index:line.length;
      const word=line.slice(start,end).trim();
      if(word)parts.push({num:circled.indexOf(matches[i][1])+1,label:matches[i][1],word});
    }
    if(parts.length>=(best?.parts.length||0))best={line,parts};
  }
  if(!best)return null;
  const cl=lines.filter(line=>line!==best.line);
  const head=/【並べ替え】/.test(cl[0]||'')?cl.shift():'';
  const body=cl.join('\n').trim(), bm=body.match(/[(（][ \u3000]*[)）]/);
  return {parts:best.parts,clean:lines.filter(line=>line!==best.line).join('\n').trim(),
    head:head.replace(/番号の順に答えなさい。?[(（]例[:：][^)）]*[)）]/,'').trim(),
    before:bm?body.slice(0,bm.index):body, after:bm?body.slice(bm.index+bm[0].length):null};
}
function ansNums(a){
  const t=String(a||'');
  return /[①-⑳]/.test(t)?[...t].filter(c=>circled.includes(c)).map(c=>circled.indexOf(c)+1):t.replace(/[^0-9]/g,'').split('').map(Number);
}
function digitOrder(value){
  return String(value||'').replace(/[①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳]/g,c=>String(circled.indexOf(c)+1)).replace(/[^0-9]/g,'');
}
function correctSentence(explanation){
  const m=String(explanation||'').match(/正解の英文\s*[:：]\s*([^\r\n]+)/);
  return m?m[1].trim():'';
}
function setData(text){
  const rows=parseCSV(text).filter(o=>(o['問題']||'').trim());
  const first=k=>{const r=rows.find(o=>(o[k]||'').trim());return r?r[k].trim():''};
  const title=first('アプリ名')||'問題演習';
  WARN=[];ALL=[];const used=new Set();
  rows.forEach((o,i)=>{
    const row=i+2;let no=parseInt(o['No'],10);
    if(!isFinite(no)||used.has(no)){WARN.push(`${row}行目: No が空か重複しています(自動で番号を振りました。記録のため No は固定を推奨)`);no=100000+i}
    const c=['A','B','C','D'].map(k=>(o['選択肢'+k]||'').trim());
    const rawFmt=(o['形式']||'').trim()||(c[0]?'4択':'入力');
    const a=(o['正解']||'').trim(), A=a.toUpperCase();
    const sort=rawFmt=='入力'&&String(o['問題']||'').includes('【並べ替え】')?sortParts(o['問題']):null;
    const fmt=rawFmt;
    if(fmt=='4択'){
      if(c.filter(Boolean).length<2||!'ABCD'.includes(A)||A.length!=1||!c['ABCD'.indexOf(A)]){WARN.push(`${row}行目(No.${no}): 4択の選択肢か正解(A〜D)が正しくないため除外しました`);return}
    }else if(fmt=='入力'){
      if(!a){WARN.push(`${row}行目(No.${no}): 入力問題の正解が空のため除外しました`);return}
      if(String(o['問題']||'').includes('【並べ替え】')&&!sort){WARN.push(`${row}行目(No.${no}): 並べ替え語句を読み取れませんでした`);return}
    }else{WARN.push(`${row}行目(No.${no}): 形式は「4択」か「入力」にしてください(除外しました)`);return}
    used.add(no);
    const question=(o['問題']).replace(/\r\n?/g,'\n').replace(/[ \t]*\n?[ \t]*(【(?:和訳|指示)】)/,'\n$1');
    ALL.push({no,q:sort?sort.clean:question,c,a:fmt=='4択'?A:a,ex:o['解説']||'',
      unit:(o['単元']||o['分野']||'').trim()||'その他',fmt,kind:sort?'sort':'text',sp:sort||null,parts:sort?sort.parts:[],sentence:sort?correctSentence(o['解説']):'',alt:(o['別解']||'').split('|').map(x=>x.trim()).filter(Boolean)});
  });
  LSK='quiz_v1_'+title;   // 学習記録はアプリ名ごとに保存(アプリ名は他のアプリと重ならないようにする)
  st=loadSt();
  document.title=title;$('#ttl').textContent=title;$('#sub').textContent=first('サブタイトル');
  FM=['4択','入力'].filter(f=>ALL.some(q=>q.fmt==f));if(!FM.includes(S.fmt))S.fmt=FM[0]||'4択';
  const units=unitsOf(S.fmt);if(!units.includes(S.unit))S.unit=units[0]||'';
  home();
}
const unitsOf=f=>[...new Set(ALL.filter(q=>q.fmt==f).map(q=>q.unit))];
const byNo=n=>ALL.find(q=>q.no===n);

function init(){
  fetch(CSV_FILE,{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.text()}).then(setData).catch(()=>{
    app.innerHTML=`<div class="msg"><b>${esc(CSV_FILE)} を読み込めませんでした。</b><p>index.html と同じフォルダにCSVを置き、GitHub Pagesなどのサーバー経由で開いてください。ファイルを直接開いている場合は、下のボタンからCSVを選べます。</p><input type="file" id="f" accept=".csv"></div>`;
    $('#f').onchange=e=>{const fr=new FileReader();fr.onload=()=>setData(fr.result);fr.readAsText(e.target.files[0],'utf-8')};
  });
}

/* ---------- ホーム ---------- */
function pool(){
  let p=ALL.filter(q=>q.fmt==S.fmt);
  if(S.scope=='unit')p=p.filter(q=>q.unit==S.unit);
  if(S.scope=='stock')p=p.filter(q=>st.stock.includes(q.no));
  return p;
}
function home(){
  Q=null;
  const stockN=ALL.filter(q=>q.fmt==S.fmt&&st.stock.includes(q.no)).length;
  const p=pool(), cnt=S.scope=='random'?Math.min(S.n,p.length):p.length;
  const o=(on,attr,main,sub)=>`<button class="opt${on?' on':''}" ${attr}>${main}${sub?`<small>${sub}</small>`:''}</button>`;
  app.innerHTML=`${WARN.length?`<details class="msg" style="margin-bottom:14px"><summary>CSVに${WARN.length}件の確認事項があります</summary>${WARN.slice(0,30).map(esc).join('<br>')}</details>`:''}
  <div class="card"><h2>出題範囲</h2><div class="row">
    ${o(S.scope=='unit','data-scope="unit"','単元別')}
    ${o(S.scope=='random','data-scope="random"','ランダム')}
    ${o(S.scope=='stock','data-scope="stock"','ストックした問題',stockN+'問')}
  </div></div>
  ${FM.length>1?`<div class="card"><h2>形式</h2><div class="row">${FM.map(f=>o(S.fmt==f,`data-fmt="${f}"`,f)).join('')}</div></div>`:''}
  ${S.scope=='unit'?`<div class="card"><h2>単元(選んだ単元の全問題に挑戦します)</h2><select id="unit">${unitsOf(S.fmt).map(u=>`<option${u==S.unit?' selected':''}>${esc(u)}</option>`).join('')}</select></div>`:''}
  ${S.scope=='random'?`<div class="card"><h2>問題数</h2><div class="row">${[10,20,50].map(n=>o(S.n==n,`data-n="${n}"`,n+'問')).join('')}</div></div>`:''}
  <button class="go" id="start" ${cnt?'':'disabled'}>${cnt?`演習スタート(${cnt}問)`:(S.scope=='stock'?'ストックした問題はまだありません':'問題がありません')}</button>
  <p style="text-align:center"><button class="link" id="rec">あなたの記録</button>　<button class="link" id="stock">ストックした問題一覧(${st.stock.length}問)</button></p>`;
  app.querySelectorAll('[data-scope]').forEach(b=>b.onclick=()=>{S.scope=b.dataset.scope;home()});
  app.querySelectorAll('[data-fmt]').forEach(b=>b.onclick=()=>{S.fmt=b.dataset.fmt;const u=unitsOf(S.fmt);if(!u.includes(S.unit))S.unit=u[0]||'';home()});
  app.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{S.n=+b.dataset.n;home()});
  const u=$('#unit');if(u)u.onchange=()=>{S.unit=u.value;home()};
  $('#start').onclick=start;$('#stock').onclick=stockView;$('#rec').onclick=recView;
}

/* ---------- 演習 ---------- */
function start(){
  let p=pool();
  if(S.scope=='random')p=shuffle(p).slice(0,S.n);
  else if(S.scope=='stock')p=shuffle(p);
  if(!p.length)return;
  Q={list:p,i:0,ok:0,ng:[],done:false};show();
}
function quit(){if(confirm('演習をやめてホームに戻りますか?\n(ここまでの正誤は保存されます)'))home()}
function show(){
  const q=Q.list[Q.i], total=Q.list.length;
  app.innerHTML=`
  <div class="bar"><span>${Q.i+1} / ${total}問 ・ 正解 ${Q.ok}</span><button id="quit">ホームに戻る</button></div>
  <div class="prog"><i style="width:${Q.i/total*100}%"></i></div>
  <div class="card"><div class="unit">${esc(q.unit)}</div>
  ${q.kind=='sort'?`<p class="sort-head">${esc(q.sp.head)}</p>`:`<p class="q">${esc(q.q)}</p>`}
  <div id="in">${q.fmt=='4択'
    ?q.c.map((t,i)=>t?`<button class="ch" data-k="${'ABCD'[i]}"><b>${'ABCD'[i]}</b>${esc(t)}</button>`:'').join('')
    :q.kind=='sort'?sortHtml(q)
    :`<input type="text" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="答えを入力"><div class="acts"><button class="next" id="ok">回答する</button></div>`}
  </div><div id="fb"></div></div>`;
  $('#quit').onclick=quit;
  if(q.fmt=='4択')app.querySelectorAll('.ch').forEach(b=>b.onclick=()=>judge(b.dataset.k));
  else if(q.kind=='sort')initSort(q);
  else{const a=$('#ans');a.focus();$('#ok').onclick=()=>judge(a.value);a.onkeydown=e=>{if(e.key=='Enter'&&!e.isComposing)judge(a.value)}}
}
function sortHtml(q){
  const s=q.sp, slot=`<span class="sort-blank empty" id="sortAnswer" aria-live="polite"></span>`;
  const line=s.after===null?`<div class="sort-line">${esc(s.before)}</div>${slot.replace('sort-blank empty','sort-blank solo empty')}`
    :`<div class="sort-line">${esc(s.before)}${slot}${esc(s.after)}</div>`;
  return `<p class="sort-hint">語句をタップして、空所に正しい順番で入れましょう。</p>${line}
    <div class="sort-words" id="sortWords">${shuffle(q.parts).map(p=>`<button type="button" class="sort-word" data-part="${q.parts.indexOf(p)}"><small>${esc(p.label)}</small>${esc(p.word)}</button>`).join('')}</div>
    <div class="sort-tools"><button type="button" id="sortUndo">↩ 1つ戻る</button><button type="button" id="sortClear">すべて消す</button><span class="sort-left" id="sortLeft"></span></div>`;
}
function initSort(q){
  Q.sortAnswer=[];const n=ansNums(q.a).length||q.parts.length;   // 解答に使う語数(「1語不要」の問題では選択肢より少ない)
  const paint=()=>{
    const el=$('#sortAnswer'),A=Q.sortAnswer;
    el.classList.toggle('empty',!A.length);
    el.innerHTML=A.length?A.map((idx,i)=>{const p=q.parts[idx];return `<button type="button" class="sort-chip" data-pos="${i}" title="タップで取り消し"><small>${esc(p.label)}</small>${esc(p.word)}</button>`}).join(''):'<span class="sort-hole">ここに入ります</span>';
    el.querySelectorAll('[data-pos]').forEach(b=>b.onclick=()=>{if(Q.done)return;Q.sortAnswer.splice(+b.dataset.pos,1);paint()});
    app.querySelectorAll('[data-part]').forEach(b=>b.disabled=A.includes(+b.dataset.part)||A.length>=n);
    $('#sortLeft').textContent=`残り ${n-A.length} 語`;
    $('#sortUndo').disabled=$('#sortClear').disabled=!A.length;
  };
  app.querySelectorAll('[data-part]').forEach(b=>b.onclick=()=>{
    if(Q.done)return;const idx=+b.dataset.part;if(Q.sortAnswer.includes(idx))return;
    Q.sortAnswer.push(idx);paint();
    if(Q.sortAnswer.length===n)judge(Q.sortAnswer.map(i=>q.parts[i].num).join(''));   // 最後の語句で自動判定
  });
  $('#sortUndo').onclick=()=>{if(!Q.done){Q.sortAnswer.pop();paint()}};
  $('#sortClear').onclick=()=>{if(!Q.done){Q.sortAnswer=[];paint()}};
  paint();
}
document.addEventListener('keydown',e=>{
  if(e.key!='Backspace'||!Q||Q.done||Q.list[Q.i].kind!='sort'||e.target.tagName=='INPUT')return;
  e.preventDefault();const u=$('#sortUndo');if(u)u.click();
});
function judge(v){
  const q=Q.list[Q.i];if(Q.done)return;
  let ok,ansText;
  if(q.fmt=='4択'){ok=v==q.a;ansText=q.a+'. '+q.c['ABCD'.indexOf(q.a)];}
  else if(q.kind=='sort'){const submitted=digitOrder(v),correct=digitOrder(q.a);ok=submitted==correct;ansText=q.a;}
  else{if(!norm(v))return;ok=[q.a,...q.alt].some(a=>norm(a)==norm(v));ansText=q.a+(q.alt.length?`(別解: ${q.alt.join(' / ')})`:'');}
  Q.done=true;Q.t=Date.now();
  const wasStock=st.stock.includes(q.no), auto=ok&&wasStock, added=!ok&&!wasStock;
  st.rec[q.no]=ok?'c':'x';
  if(ok){Q.ok++;if(wasStock)st.stock=st.stock.filter(n=>n!==q.no)}
  else{Q.ng.push(q);if(!wasStock)st.stock.push(q.no)}
  save();
  const lbl=()=>st.stock.includes(q.no)?'★ ストック済み':(auto?'☆ まだ自信がないのでストックに戻す':'☆ ストックに入れる');
  if(q.fmt=='4択')app.querySelectorAll('.ch').forEach(b=>{b.disabled=true;if(b.dataset.k==q.a)b.classList.add('ok');else if(b.dataset.k==v)b.classList.add('ng')});
  else if(q.kind=='sort'){
    app.querySelectorAll('[data-part],#sortUndo,#sortClear').forEach(b=>b.disabled=true);
    const correct=ansNums(q.a);
    $('#sortAnswer').innerHTML=Q.sortAnswer.map((idx,i)=>{const p=q.parts[idx],good=p.num===correct[i];return `<span class="sort-chip ${good?'ok':'ng'}"><small>${esc(p.label)}</small>${esc(p.word)}</span>`}).join('');
  }else{$('#ans').disabled=true;$('#ok').remove()}
  const last=Q.i==Q.list.length-1;
  const sortFeedback=q.kind=='sort'?`<p>あなたの解答: <span class="ans">${esc(Q.sortAnswer.map(i=>q.parts[i].label).join(''))}</span></p><p>正しい番号: <span class="ans">${esc(q.a)}</span></p>${q.sentence?`<p><b>正しい英文</b><br><span class="ans">${esc(q.sentence)}</span></p>`:''}`:'';
  $('#fb').innerHTML=`<div class="fb${ok?'':' bad'}"><h3>${ok?'◯ 正解':'✕ 不正解'}</h3>
    ${q.kind=='sort'?sortFeedback:`<p>正解: <span class="ans">${esc(ansText)}</span></p>`}<p>${esc(q.ex)}</p>${auto?'<p class="sub">ストックした問題に正答したので、正答扱いになりストックから外れました。</p>':''}${added?'<p class="sub">間違えた問題なので、ストックに追加しました。</p>':''}</div>
    <div class="acts"><button class="st${st.stock.includes(q.no)?' on':''}" id="stk">${lbl()}</button>
    <button class="next" id="nx">${last?'結果を見る':'次の問題'}</button></div>`;
  $('#stk').onclick=e=>{toggleStock(q.no);e.target.classList.toggle('on',st.stock.includes(q.no));e.target.textContent=lbl()};
  $('#nx').onclick=()=>{Q.done=false;if(last)result();else{Q.i++;show();scrollTo(0,0)}};
}
// Enterキーで次の問題へ(回答直後のEnterの二重入力は無視する)
document.addEventListener('keydown',e=>{
  if(e.key!='Enter'||e.isComposing||!Q||!Q.done||e.target.tagName=='BUTTON'||Date.now()-Q.t<400)return;
  const n=$('#nx');if(n){e.preventDefault();n.click()}
});
function toggleStock(n){st.stock=st.stock.includes(n)?st.stock.filter(x=>x!==n):[...st.stock,n];save()}
function result(){
  const t=Q.list.length;
  app.innerHTML=`<div class="card"><h2>結果</h2><div class="big">${Q.ok} / ${t}</div>
  <p style="text-align:center;margin:0">正答率 ${Math.round(Q.ok/t*100)}%</p></div>
  ${Q.ng.length?`<div class="card"><h2>間違えた問題(${Q.ng.length}問・ストックに追加済み。「ストックした問題」で復習できます)</h2>${Q.ng.map(q=>`<div class="li"><div class="q" style="font-size:17px;margin:0">${esc(q.q)}</div><div>正解: <span class="ans">${esc(q.kind=='sort'?q.a:(q.a.length==1&&q.fmt=='4択'?q.a+'. '+q.c['ABCD'.indexOf(q.a)]:q.a))}</span></div>${q.kind=='sort'&&q.sentence?`<div class="ans">${esc(q.sentence)}</div>`:''}</div>`).join('')}</div>`:''}
  <button class="go" id="h">ホームに戻る</button>`;
  $('#h').onclick=home;scrollTo(0,0);
}

/* ---------- あなたの記録 ---------- */
function stats(){
  return [...new Set(ALL.map(q=>q.unit))].map(u=>{
    const qs=ALL.filter(q=>q.unit==u);
    return{u,total:qs.length,tried:qs.filter(q=>st.rec[q.no]).length,
      ok:qs.filter(q=>st.rec[q.no]=='c'&&!st.stock.includes(q.no)).length};
  });
}
const pct=(a,b)=>b?Math.round(a/b*100):null;
function meter(label,v,color){
  return `<div class="m"><span>${label}</span><div class="t"><i style="width:${v||0}%;background:${color}"></i></div><b>${v==null?'—':v+'%'}</b></div>`;
}
function recView(){
  const ss=stats(), sum=ss.reduce((a,x)=>({total:a.total+x.total,tried:a.tried+x.tried,ok:a.ok+x.ok}),{total:0,tried:0,ok:0});
  const block=(name,x)=>`<div class="rec"><h3>${esc(name)}</h3>${meter('達成率',pct(x.ok,x.total),'var(--hi)')}${meter('正答率',pct(x.ok,x.tried),'var(--ok)')}
    <div class="sub">正答 ${x.ok}問 / 全${x.total}問 ・ 演習済み ${x.tried}問</div></div>`;
  app.innerHTML=`<div class="bar"><span>あなたの記録</span><button id="b">ホームに戻る</button></div>
  <div class="card">${block('全体',sum)}</div>
  <div class="card"><h2>単元ごとの記録</h2>${ss.map(x=>block(x.u,x)).join('')}</div>
  <div class="card"><h2>達成率・正答率とは</h2>
    <p class="sub" style="margin:0 0 6px"><b>達成率</b> = 単元の全問題(4択・入力の合計)のうち、正答した問題の割合</p>
    <p class="sub" style="margin:0 0 6px"><b>正答率</b> = 演習した問題のうち、正答した問題の割合</p>
    <p class="sub" style="margin:0">・各問題の「最新の解答」で数えます(間違えた問題を後で正解すれば、正答になります)。<br>・間違えた問題と、自分で「ストック」した問題は、どちらも「ストックした問題」に入ります。ストック中は正答に数えず、もう一度正答するとストックから外れて正答扱いになります。</p></div>
  <p style="text-align:center"><button class="link" id="reset">記録をリセットする</button></p>`;
  $('#b').onclick=home;
  $('#reset').onclick=()=>{if(confirm('正誤の記録(達成率・正答率)をリセットします。ストックした問題は残ります。よろしいですか?')){st.rec={};save();recView()}};
  scrollTo(0,0);
}

/* ---------- ストック ---------- */
function stockView(){
  const items=st.stock.map(byNo).filter(Boolean);
  app.innerHTML=`<div class="bar"><span>ストックした問題(${items.length}問)</span><button id="b">ホームに戻る</button></div>
  <div class="card">${items.length?items.map(q=>`<div class="li"><div class="unit">${esc(q.unit)}(${q.fmt})</div>
    <div class="q" style="font-size:17px;margin:0 0 4px">${esc(q.q)}</div>
    <div>正解: <span class="ans">${esc(q.kind=='sort'?q.a:(q.fmt=='4択'?q.a+'. '+q.c['ABCD'.indexOf(q.a)]:q.a))}</span></div>${q.kind=='sort'&&q.sentence?`<div class="ans">${esc(q.sentence)}</div>`:''}
    <div style="color:var(--mut);font-size:14px">${esc(q.ex)}</div>
    <button class="link" data-r="${q.no}">ストックから外す</button></div>`).join(''):'<p>ストックした問題はまだありません。演習で間違えた問題や、「ストック」を押した問題がここに溜まります。</p>'}</div>`;
  $('#b').onclick=home;
  app.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{toggleStock(+b.dataset.r);stockView()});
}
init();
</script>
</body>
</html>
